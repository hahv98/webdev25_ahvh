<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/main.css">
    <title>SASS</title>
</head>
<body>
    <div class="flex-column main-container">
        <header>
            <h1>Min første SASS nettside</h1>
        </header>
        <main class="flex">
            <section id="grid-layout">
                <article class="card success">
                    <h3>Suksess</h3>
                </article>

                <article class="card warning">
                    <h3>Advarsel</h3>
                </article>

                <article class="card error">
                    <h3>ERROR!</h3>
                </article>
            </section>
        </main>
        <footer>
            <p>Webutvikling 2025</p>
        </footer>
    </div>
</body>
</html>
